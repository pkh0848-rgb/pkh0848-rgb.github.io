<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<style id="vpg">html{opacity:0}</style><noscript><style>html{opacity:1!important}</style></noscript>
<script>/* 화면 크기 보정 v2 — 갤럭시 등 일부 기기가 뷰포트를 실제 화면보다 훨씬 넓게 잡아
   화면 전체가 작게 보이는 문제를 바로잡는다. 아이폰·아이패드·PC는 조건에 걸리지 않아 무영향.
   ※ v1은 head 파싱 시점에 한 번만 측정했는데, 첫 로드에는 아직 레이아웃이 확정되지 않아
     값을 못 믿는다(그래서 새로고침해야 커졌다). v2는 레이아웃이 잡히는 여러 시점에 다시 재고,
     meta 태그를 통째로 교체해 브라우저가 확실히 재계산하게 한다. 결과는 검증 후 이상하면 되돌린다. */
(function(){
  var BASE=402, done=false, gaveUp=false, shown=false;
  function meta(){ return document.querySelector('meta[name=viewport]'); }
  function setVp(content){
    var old=meta(), m=document.createElement('meta');
    m.setAttribute('name','viewport'); m.setAttribute('content',content);
    if(old&&old.parentNode) old.parentNode.replaceChild(m,old);
    else (document.head||document.documentElement).appendChild(m);
  }
  function keepRest(){                       /* 기존 meta의 width 계열만 걷어내고 나머지는 보존 */
    var m=meta(), c=m?(m.getAttribute('content')||''):'';
    return c.replace(/(^|,)\s*(width|initial-scale|minimum-scale|maximum-scale|user-scalable)\s*=[^,]*/g,'')
            .replace(/,{2,}/g,',').replace(/^,|,$/g,'').trim();
  }
  function reveal(){
    if(shown) return; shown=true;
    var g=document.getElementById('vpg');
    if(g&&g.parentNode) g.parentNode.removeChild(g);
    document.documentElement.style.opacity='';
  }
  function verify(w){
    var iw=window.innerWidth||0;
    window.__vpFix.after=iw;
    if(iw>0 && (iw<260 || iw>780)){        /* 기기가 예상과 다르게 동작 → 원상복구하고 더는 건드리지 않음 */
      var rest=keepRest();
      setVp('width=device-width,initial-scale=1.0'+(rest?','+rest:''));
      window.__vpFix.reverted=true; done=false; gaveUp=true;
    }
    reveal();
  }
  function fix(){
    if(done||gaveUp) return;
    try{
      var sw=screen.width||0, iw=window.innerWidth||0;
      if(sw>0 && iw>0 && (iw/sw)>1.3){
        var k=iw/sw, w=Math.max(60, Math.round(BASE/k)), rest=keepRest();
        setVp('width='+w+(rest?','+rest:''));
        done=true;
        window.__vpFix={applied:true,ratio:+k.toFixed(2),width:w,screen:sw,before:iw};
        setTimeout(function(){ verify(w); },180);
      }
    }catch(e){}
  }
  window.__vpFix={applied:false};
  fix();
  [0,16,40,80,150,300,600].forEach(function(t){ setTimeout(fix,t); });
  if(window.requestAnimationFrame) requestAnimationFrame(function(){ fix(); requestAnimationFrame(fix); });
  document.addEventListener('DOMContentLoaded',function(){ fix(); setTimeout(reveal,60); });
  window.addEventListener('load',function(){ fix(); reveal(); });
  window.addEventListener('pageshow',fix);
  window.addEventListener('resize',fix);
  window.addEventListener('orientationchange',fix);
  setTimeout(reveal,900);                   /* 안전장치 — 무슨 일이 있어도 화면은 반드시 보여준다 */
})();</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ── ourLog 로그인 ───────────────────────────────────────────
   여기서 한 번 로그인하면 네 앱을 모두 쓸 수 있다.
   앱마다 Firebase 프로젝트가 달라서 세션도 따로 필요한데,
   로그인 직후 sso.html 을 앱마다 하나씩 보이지 않게 띄워
   각 앱의 세션을 미리 만들어 둔다. 그래서 앱에 들어갈 땐 로그인 화면이 없다. */
(function(){
  var TOKEN_KEY='ourlog_gidt';
  var APPS=['homelog','studylog','healthlog','somedaylog'];
  var CFG={apiKey:"AIzaSyCCwWQ3bfyUORSqPuiKT0RHanwfnRV6pz0",
    authDomain:"somedaylog-7e021.firebaseapp.com",projectId:"somedaylog-7e021",
    appId:"1:181219597244:web:43684dee4341a3059869b9"};

  var app=firebase.initializeApp(CFG,'launcher');
  var auth=firebase.auth(app);
  var $=function(id){ return document.getElementById(id); };
  var esc=function(v){ return String(v==null?'':v).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

  function saveToken(t){ try{ localStorage.setItem(TOKEN_KEY, JSON.stringify({t:t, exp:Date.now()+55*60*1000})); }catch(e){} }
  function hasToken(){ try{ var v=JSON.parse(localStorage.getItem(TOKEN_KEY)||'null'); return !!(v&&v.exp>Date.now()); }catch(e){ return false; } }
  function clearToken(){ try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} }

  function msg(text, isErr){
    var m=$('gMsg'); if(!m) return;
    m.textContent=text||''; m.className='gmsg'+(isErr?' err':'');
  }

  /* 각 앱 세션 만들기 — 숨은 iframe으로 sso.html 을 앱마다 한 번씩 */
  function prepareSessions(){
    if(!hasToken()) return Promise.resolve([]);
    return Promise.all(APPS.map(function(name){
      return new Promise(function(done){
        var f=document.createElement('iframe');
        f.style.cssText='position:absolute;width:0;height:0;border:0;opacity:0;pointer-events:none';
        f.src='./sso.html#'+name;
        var finished=false;
        function finish(ok){
          if(finished) return; finished=true;
          window.removeEventListener('message', onMsg);
          setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 60);
          done({app:name, ok:ok});
        }
        function onMsg(e){
          if(e.origin!==location.origin) return;
          var d=e.data;
          if(d && d.ourlogSSO && d.app===name) finish(!!d.ok);
        }
        window.addEventListener('message', onMsg);
        setTimeout(function(){ finish(false); }, 12000);
        document.body.appendChild(f);
      });
    }));
  }

  function showGate(){ $('gate').classList.remove('hidden'); $('hub').classList.add('hidden'); }
  function showHub(user){
    $('gate').classList.add('hidden'); $('hub').classList.remove('hidden');
    var pic=user.photoURL ? '<img src="'+esc(user.photoURL)+'" alt=""/>' : '🙂';
    $('meBar').innerHTML='<span class="av">'+pic+'</span>'
      + '<span class="nm">'+esc(user.displayName||user.email||'')+'</span>'
      + '<button id="btnOut">로그아웃</button>';
    $('btnOut').onclick=function(){
      clearToken();
      auth.signOut().then(function(){ location.reload(); });
    };
  }

  $('gLogin').onclick=function(){
    var b=this; b.disabled=true; msg('구글 창에서 계정을 선택해 주세요…');
    var p=new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({prompt:'select_account'});
    auth.signInWithPopup(p).then(function(res){
      if(res.credential && res.credential.idToken) saveToken(res.credential.idToken);
      msg('앱을 준비하고 있어요…');
      return prepareSessions().then(function(r){
        var failed=r.filter(function(x){ return !x.ok; });
        showHub(res.user);
        if(failed.length) msg('일부 앱은 처음 열 때 로그인이 한 번 더 필요할 수 있어요');
        else msg('');
      });
    }).catch(function(e){
      b.disabled=false;
      var c=(e&&e.code)||'';
      if(c.indexOf('popup-closed')>=0||c.indexOf('cancelled-popup')>=0){ msg(''); return; }
      if(c.indexOf('popup-blocked')>=0){ msg('브라우저가 팝업을 막았어요. 팝업을 허용한 뒤 다시 눌러주세요.', true); return; }
      msg('로그인하지 못했어요 · '+((e&&e.message)||c), true);
    });
  };

  auth.onAuthStateChanged(function(u){
    if(u){
      showHub(u);
      /* 이미 로그인된 상태로 다시 들어온 경우에도 세션이 비어 있으면 채운다 */
      if(hasToken()) prepareSessions();
    } else {
      showGate();
    }
  });
})();
</script>
