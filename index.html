<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<style id="vpg">html{opacity:0}</style><noscript><style>html{opacity:1!important}</style></noscript>
<script>/* 화면 크기 보정 v2 — 일부 기기(갤럭시 등)가 뷰포트를 실제 화면보다 넓게 잡는 문제 보정 */
(function(){
  var BASE=402,done=false,gaveUp=false,shown=false;
  function meta(){return document.querySelector('meta[name=viewport]');}
  function setVp(c){var o=meta(),m=document.createElement('meta');m.setAttribute('name','viewport');m.setAttribute('content',c);
    if(o&&o.parentNode)o.parentNode.replaceChild(m,o);else (document.head||document.documentElement).appendChild(m);}
  function keepRest(){var m=meta(),c=m?(m.getAttribute('content')||''):'';
    return c.replace(/(^|,)\s*(width|initial-scale|minimum-scale|maximum-scale|user-scalable)\s*=[^,]*/g,'').replace(/,{2,}/g,',').replace(/^,|,$/g,'').trim();}
  function reveal(){if(shown)return;shown=true;var g=document.getElementById('vpg');if(g&&g.parentNode)g.parentNode.removeChild(g);document.documentElement.style.opacity='';}
  function verify(){var iw=window.innerWidth||0;if(iw>0&&(iw<260||iw>780)){var r=keepRest();setVp('width=device-width,initial-scale=1.0'+(r?','+r:''));done=false;gaveUp=true;}reveal();}
  function fix(){if(done||gaveUp)return;try{var sw=screen.width||0,iw=window.innerWidth||0;
    if(sw>0&&iw>0&&(iw/sw)>1.3){var k=iw/sw,w=Math.max(60,Math.round(BASE/k)),r=keepRest();setVp('width='+w+(r?','+r:''));done=true;setTimeout(verify,180);}}catch(e){}}
  fix();[0,16,40,80,150,300,600].forEach(function(t){setTimeout(fix,t);});
  if(window.requestAnimationFrame)requestAnimationFrame(function(){fix();requestAnimationFrame(fix);});
  document.addEventListener('DOMContentLoaded',function(){fix();setTimeout(reveal,60);});
  window.addEventListener('load',function(){fix();reveal();});
  window.addEventListener('pageshow',fix);window.addEventListener('resize',fix);window.addEventListener('orientationchange',fix);
  setTimeout(reveal,900);
})();</script>
